name: Build APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - run: chmod +x gradlew && ./gradlew assembleRelease --stacktrace
      - run: cp app/build/outputs/apk/release/app-release.apk Notes.apk
      - uses: actions/upload-artifact@v4
        with:
          name: notes-apk
          path: Notes.apk
      # Публикуем релиз: постоянная ссылка .../releases/latest/download/Notes.apk
      - uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: v1.${{ github.run_number }}
          name: Заметки 1.${{ github.run_number }}
          body: ${{ github.event.head_commit.message }}
          files: Notes.apk
          make_latest: true
